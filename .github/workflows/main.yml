# https://qiita.com/cardene/items/67d31f13d27865a12ecf 参照
# ワークフロー名
name: housework_bot
on:
  schedule:
    # 定期実行する時間・・・①
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手動で実行できるようにする

jobs:
  build:
    # Ubuntuの最新版環境内で処理を実行することを指定
    runs-on: ubuntu-latest

    # 実行する処理＆コマンド指定
    steps:
      - uses: actions/checkout@v2
      - name: Set up 3.10.15
        uses: actions/setup-python@v1
        with:
          python-version: 3.10.15
      - name: Install dependencies
        run: |
          # pip更新
          python -m pip install --upgrade pip
          # 必要なパッケージインストール・・・②
          pip install google
          pip install requests
          pip install gspread google-auth

      - name: Run script
        run: |
          # 定期実行するファイルを指定。・・・③
          python write_spread_sheet.py
        env:
          # 環境変数設定
          SPREAD_SHEET_URL: ${{ secrets.SPREAD_SHEET_URL }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          
